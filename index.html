<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Money Tracker</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#e6e6e8;--soft:#f2f2f4;--card:#fff;--acc:#2c2c2e;--accfg:#fff;--red:#d0021b;--green:#08883a;--hpos:#5fe39a;--hneg:#ff8a95;--sh:rgba(0,0,0,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 4px}
header h1{font-size:19px;font-weight:800;letter-spacing:-.3px;flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:var(--soft)}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#syncBtn{font-size:12px;color:var(--mut);padding:6px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 0;font-weight:700;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-color:var(--fg)}
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:14px 16px 110px;overscroll-behavior-y:contain}
@media(min-width:900px){.tabs{display:none}.pager{overflow:hidden;gap:28px;padding:0 16px}.page{flex:1 1 0;padding:14px 4px 110px}}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card{background:var(--card)}
.hero{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.hero .lbl{color:inherit;opacity:.7}
.hero .pos{color:var(--hpos)}.hero .neg{color:var(--hneg)}
.lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.big{font-size:32px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;word-break:break-all}
.mid{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.row3>div{min-width:0}.row3 .mid{font-size:14.5px;word-break:break-all}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin:0;padding:14px;min-width:0}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.sm{font-size:12.5px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;gap:8px}
.sec h3{font-size:16px;font-weight:800}
.lnk{font-weight:700;font-size:13.5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.over i{background:var(--red)}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;position:relative;min-width:0}
.acc.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.acc .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.acc .ty{font-size:11px;color:var(--mut)}
.acc .b{font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px;word-break:break-all}
.acc .ed{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;color:var(--mut);font-size:16px;line-height:1}
.srch{display:flex;gap:8px;margin-bottom:8px}
.list{position:relative}
.tx{display:flex;align-items:center;gap:6px;padding:11px 2px;border-bottom:1px solid var(--line);background:var(--bg);position:relative}
.tx .h{touch-action:none;cursor:grab;padding:10px 6px;color:var(--mut);font-size:16px;line-height:1;user-select:none;-webkit-user-select:none}
.tx .m{flex:1;min-width:0}
.t1{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .r{text-align:right;flex-shrink:0;max-width:48%}
.amt{font-weight:800;font-variant-numeric:tabular-nums}
.bal{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tx.drag{z-index:5;box-shadow:0 8px 24px var(--sh);border-radius:12px;opacity:.97}
.tx.sh{transition:transform .14s ease}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
.more{display:block;margin:14px auto 0}
.debt{cursor:pointer}
.debt .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.debt .top b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.debt .sched{font-size:13px;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.debt .sched span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-right:4px;text-transform:uppercase}
.fab{position:fixed;right:max(20px,calc(50% - 580px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--accfg);font-size:32px;line-height:1;box-shadow:0 8px 22px var(--sh);z-index:10}
.fab:active{transform:scale(.95)}
dialog{border:0;padding:0;width:100%;max-width:540px;max-height:94vh;max-height:94dvh;border-radius:22px 22px 0 0;margin:auto auto 0;background:var(--card);color:var(--fg);overflow:hidden}
@media(min-width:640px){dialog{border-radius:22px;margin:auto}}
dialog::backdrop{background:rgba(0,0,0,.5)}
.si{padding:16px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;max-height:94vh;max-height:94dvh}
.shd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.shd h2{font-size:19px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:15px;flex-shrink:0}
.f{display:block;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:12px;outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--fg);-webkit-appearance:auto;appearance:auto;flex-shrink:0}
.amtin{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px;margin-top:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--acc);color:var(--accfg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.chip small{font-weight:500;opacity:.7}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:8px}
.row2.eq{grid-template-columns:1fr 1fr;margin-top:0}
.row2>div{min-width:0}
.ck{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.prev{margin-top:14px;padding:12px;border-radius:12px;background:var(--soft);font-size:13.5px;font-variant-numeric:tabular-nums}
.prev div+div{margin-top:4px}
.btn{display:block;width:100%;border-radius:14px;padding:15px;font-weight:800;background:var(--acc);color:var(--accfg);font-size:16px;margin-top:16px}
.btn.gh{background:var(--soft);color:var(--fg)}
.btn.dg{background:none;color:var(--red);border:1.5px solid var(--red);margin-top:10px}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2 .btn{margin-top:10px;padding:13px 6px;font-size:15px}
.feerow{display:grid;grid-template-columns:1.4fr 1fr 40px;gap:6px;margin-top:6px}
.feerow button{background:var(--soft);border-radius:12px;font-size:16px}
.ba{display:flex;justify-content:space-between;gap:8px;padding:12px;border-radius:12px;background:var(--soft);margin-bottom:12px;font-variant-numeric:tabular-nums;font-size:13.5px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mi span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .rt{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pl{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pl .pk{min-width:0}
.pl .pk b{display:block;font-size:14.5px}
.pl .pk span{font-size:12px;color:var(--mut)}
.pl input{min-height:42px;padding:9px 10px;text-align:right;font-weight:700}
.pl.past{opacity:.6}
.pl.cur{box-shadow:inset 3px 0 0 var(--acc);padding-left:8px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sw button{border:1.5px solid var(--line);border-radius:14px;padding:8px;text-align:left;font-size:12.5px;font-weight:700}
.sw button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.sw i{display:flex;height:34px;border-radius:9px;margin-bottom:6px;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.sw i b{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:10px}
.dots button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.dots button.on{outline:2.5px solid var(--fg);outline-offset:2px}
.dots label{width:40px;height:40px;border-radius:50%;border:2px dashed var(--mut);display:grid;place-items:center;font-size:18px;cursor:pointer;position:relative;overflow:hidden}
.dots input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--acc);color:var(--accfg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.cats .ci{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
.cats .bar{margin-top:3px;height:5px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Money Tracker</h1>
    <button id="syncBtn" type="button">Local only</button>
    <button class="ib" id="setBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <nav class="tabs">
    <button class="tab on" data-p="0" type="button">Budget &amp; Expense</button>
    <button class="tab" data-p="1" type="button">Debt &amp; Loans</button>
  </nav>
  <main class="pager" id="pager">
    <section class="page" id="p1">
      <div class="card hero">
        <div class="lbl">Total Money</div>
        <div class="big" id="hTot"></div>
        <div class="row3">
          <div><div class="lbl">Spendable</div><div class="mid" id="hAvail"></div></div>
          <div><div class="lbl">Savings</div><div class="mid" id="hSav"></div></div>
          <div><div class="lbl">Debt</div><div class="mid" id="hDebt"></div></div>
        </div>
        <div class="sm" style="margin-top:12px;opacity:.75">Net worth (money + receivables − debt): <b id="hNet"></b></div>
      </div>
      <div class="grid2">
        <div class="card"><div class="lbl">Today</div><div class="mid pos" id="dIn"></div><div class="mid neg" id="dOut"></div></div>
        <div class="card"><div class="lbl">This Month</div><div class="mid pos" id="mIn"></div><div class="mid neg" id="mOut"></div><div class="sm mut" id="mFee"></div></div>
      </div>
      <div class="card" id="budCard"></div>
      <div class="sec"><h3>Accounts</h3><button class="lnk" id="addAcc" type="button">+ Account</button></div>
      <div class="accs" id="accs"></div>
      <div class="sec"><h3 id="histT">History</h3><button class="lnk" id="sortBtn" type="button">Sort by date</button></div>
      <div class="srch"><input id="q" type="search" placeholder="Search description, category, account"></div>
      <div class="list" id="list"></div>
      <button class="lnk more" id="moreBtn" type="button" hidden>Show more</button>
    </section>
    <section class="page" id="p2">
      <div class="card hero">
        <div class="lbl">Total Debt (I owe)</div>
        <div class="big" id="tOwe"></div>
        <div class="row3">
          <div><div class="lbl">Receivable</div><div class="mid" id="tRec"></div></div>
          <div><div class="lbl">My Money</div><div class="mid" id="tMoney"></div></div>
          <div><div class="lbl">After paying</div><div class="mid" id="tAfter"></div></div>
        </div>
        <div class="sm" style="margin-top:12px;opacity:.75">Net worth: <b id="tNet"></b> · Savings: <b id="tSav"></b></div>
      </div>
      <div class="grid2">
        <div class="card"><div class="lbl">Dues this month</div><div class="mid" id="tMon"></div><div class="sm mut" id="tMonN"></div></div>
        <div class="card"><div class="lbl">Still unpaid</div><div class="mid" id="tDue"></div><div class="sm mut" id="tDueN"></div></div>
      </div>
      <div class="seg" id="dFil"><button data-v="act" class="on" type="button">Active</button><button data-v="paid" type="button">Paid</button><button data-v="all" type="button">All</button></div>
      <div class="sec"><h3>Debts &amp; Loans</h3><button class="lnk" id="addDebt" type="button">+ Add</button></div>
      <div class="chips scroll" id="dCat" style="margin-bottom:10px"></div>
      <div id="dList"></div>
    </section>
  </main>
</div>
<button class="fab" id="fab" type="button" aria-label="Add">+</button>
<dialog id="dlg"><div class="si" id="dlgIn"></div></dialog>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var KEY='mt.data.v1', BAK='mt.backup.v1';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var now=function(){return Date.now()};
var uid=function(){return now().toString(36)+Math.random().toString(36).slice(2,8)};
var r2=function(n){return Math.round((+n||0)*100)/100};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?r2(n):0};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var live=function(a){return (a||[]).filter(function(x){return !x.del})};
var byId=function(a,id){for(var i=0;i<(a||[]).length;i++)if(a[i].id===id)return a[i];return null};
var localISO=function(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
var ymd=function(d){return localISO(d).slice(0,10)};
var nf=new Intl.NumberFormat('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
var dfm=new Intl.DateTimeFormat('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
var dfy=new Intl.DateTimeFormat('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
var ddf=new Intl.DateTimeFormat('en-PH',{month:'short',day:'numeric',year:'numeric'});
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function cur(){return (S&&S.settings.cur)||'₱'}
function money(n){n=r2(n);return (n<0?'−':'')+cur()+nf.format(Math.abs(n))}
function sgn(n){n=r2(n);return (n>0?'+':n<0?'−':'')+cur()+nf.format(Math.abs(n))}
function cls(n){return n>0?'pos':n<0?'neg':''}
function fdt(s){if(!s)return'';var d=new Date(s);if(isNaN(d))return s;return (d.getFullYear()===new Date().getFullYear()?dfm:dfy).format(d)}
function fdate(s){if(!s)return'';var d=new Date(s+'T00:00');return isNaN(d)?s:ddf.format(d)}
function dtPos(dt){var t=new Date(dt).getTime();if(!isFinite(t))t=now();return t+(now()%60000)}
var TYPES={cash:'Cash',bank:'Bank',ewallet:'E-wallet'};
var DEFCAT={out:['Food','Transport','Bills','Groceries','Shopping','Load/Data','Health','Others'],in:['Salary','Allowance','Business','Sideline','Gift','Refund','Others'],xfer:['Transfer','Cash-in','Cash-out','Savings']};
var BANKS=['Cash','GCash','Maya','GoTyme','SeaBank','ShopeePay','GrabPay','Coins.ph','PayPal','BDO','BPI','Metrobank','UnionBank','Landbank','Security Bank','RCBC','PNB','China Bank','EastWest','CIMB','Tonik','Savings'];
var DCATS=['SPayLater','Shopee Loan','LazPayLater','GGives','GLoan','GCredit','Maya Credit','Maya Loan','BillEase','Atome','Home Credit','Credit Card','Pag-IBIG Loan','SSS Loan','GSIS Loan','Bank Loan','Salary Loan','Car Loan','Housing Loan','Personal','Others'];
var BNPL=/later|ggives|gcredit|maya credit|billease|atome|home credit|credit card/i;
var FREQ={once:'One-time',weekly:'Weekly',semi:'Every 15 days',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly'};
var FMUL={once:0,weekly:52/12,semi:2,monthly:1,quarterly:1/3,yearly:1/12};

/* ---------- storage ---------- */
var S;
function blank(){var t=now();return{ver:1,accounts:[{id:uid(),u:t,name:'Cash',type:'cash',init:0,fees:[],sav:false,hide:false}],tx:[],debts:[],memo:{},settings:{u:0,budget:0,cur:'₱',theme:'auto'},local:{syncUrl:'',token:'',lastSync:0,dirty:false,lastAcc:''}}}
function load(){
  var raw=null;try{raw=localStorage.getItem(KEY);S=JSON.parse(raw)}catch(e){S=null}
  if(!S||!S.accounts){try{var b=localStorage.getItem(BAK);S=JSON.parse(b);if(S&&S.accounts){raw=b;}}catch(e){S=null}}
  if(!S||!S.accounts)S=blank();else{try{localStorage.setItem(BAK,raw)}catch(e){}}
  var d=blank();S.tx=S.tx||[];S.debts=S.debts||[];S.memo=S.memo||{};
  S.settings=Object.assign(d.settings,S.settings||{});S.local=Object.assign(d.local,S.local||{});
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full! Export a backup.')}}
function save(){S.local.dirty=true;persist();schedSync()}

/* ---------- debt schedule helpers ---------- */
function debtTotal(d){var s=num(d.amt);(d.adds||[]).forEach(function(a){if(!a.del)s+=num(a.amt)});return r2(s)}
function period(freq,dueStr,ref){
  var y=ref.getFullYear(),m=ref.getMonth(),dd=ref.getDate(),dueD=dueStr?new Date(dueStr+'T00:00'):null;
  if(dueD&&isNaN(dueD))dueD=null;var day=dueD?dueD.getDate():0;
  function mk(Y,M,D){var last=new Date(Y,M+1,0).getDate();return ymd(new Date(Y,M,Math.min(D,last)))}
  if(freq==='monthly')return{s:mk(y,m,1),e:mk(y,m,31),due:day?mk(y,m,day):mk(y,m,31)};
  if(freq==='yearly'){var dm=dueD?dueD.getMonth():11;return{s:mk(y,0,1),e:mk(y,11,31),due:day?mk(y,dm,day):mk(y,11,31)}}
  if(freq==='quarterly'){var q=Math.floor(m/3)*3,qm=dueD?q+dueD.getMonth()%3:q+2;return{s:mk(y,q,1),e:mk(y,q+2,31),due:day?mk(y,qm,day):mk(y,q+2,31)}}
  if(freq==='semi'){if(dd<=15)return{s:mk(y,m,1),e:mk(y,m,15),due:mk(y,m,15)};return{s:mk(y,m,16),e:mk(y,m,31),due:mk(y,m,31)}}
  if(freq==='weekly'){var w=(ref.getDay()+6)%7,off=dueD?(dueD.getDay()+6)%7:6;return{s:ymd(new Date(y,m,dd-w)),e:ymd(new Date(y,m,dd-w+6)),due:ymd(new Date(y,m,dd-w+off))}}
  return null;
}
function nextPeriod(freq,due,p){var nx=new Date(p.e+'T00:00');nx.setDate(nx.getDate()+1);return period(freq,due,nx)}
function prevPeriod(freq,due,p){var nx=new Date(p.s+'T00:00');nx.setDate(nx.getDate()-1);return period(freq,due,nx)}
function plabel(f,p){var s=new Date(p.s+'T00:00'),m=MN[s.getMonth()],y=s.getFullYear();
  if(f==='monthly')return m+' '+y;if(f==='yearly')return ''+y;if(f==='quarterly')return 'Q'+(Math.floor(s.getMonth()/3)+1)+' '+y;
  if(f==='semi')return m+' '+s.getDate()+'–'+new Date(p.e+'T00:00').getDate()+', '+y;return 'Week of '+fdate(p.s)}
function hasPlan(d){return !!(d.sched&&Object.keys(d.sched).length)}
/* amount planned for a period: manual amount if set, otherwise default per payment */
function planAmt(d,p){var s=d.sched||{};return Object.prototype.hasOwnProperty.call(s,p.s)?num(s[p.s]):num(d.inst)}
function isSched(d){return d.freq&&d.freq!=='once'&&(num(d.inst)>0||hasPlan(d))}
function nextDue(d,p){for(var i=0;i<120;i++){p=nextPeriod(d.freq,d.due,p);if(planAmt(d,p)>0)return p}return null}
function freqText(d){var f=d.freq||'once';if(!isSched(d))return FREQ[f]||'One-time';return FREQ[f]+(hasPlan(d)?' · varies':' '+money(d.inst))}
function upcoming(d,n){var out=[],p=period(d.freq,d.due,new Date());for(var i=0;i<60&&out.length<n;i++){var a=planAmt(d,p);if(a>0)out.push({p:p,a:a});p=nextPeriod(d.freq,d.due,p)}return out}

/* ---------- compute ---------- */
var C={};
function delta(t){var a=num(t.amt),f=num(t.fee);if(t.type==='in')return{a:r2(a-f),b:0};if(t.type==='out')return{a:-r2(a+f),b:0};return{a:-r2(a+f),b:a}}
function compute(){
  var bal=Object.create(null),total=0,run=new Map(),accs=live(S.accounts);
  accs.forEach(function(a){bal[a.id]=num(a.init);total=r2(total+bal[a.id])});
  var list=live(S.tx).sort(function(a,b){return a.pos-b.pos});
  var paid={},pays={},tdy=new Date(),today=ymd(tdy),mon=today.slice(0,7);
  var st={dIn:0,dOut:0,mIn:0,mOut:0,mFee:0,cats:{}};
  list.forEach(function(t){
    var d=delta(t),p=total,ha=t.acc in bal,hb=t.type==='xfer'&&(t.to in bal);
    if(ha){bal[t.acc]=r2(bal[t.acc]+d.a);total=r2(total+d.a)}
    if(hb){bal[t.to]=r2(bal[t.to]+d.b);total=r2(total+d.b)}
    run.set(t.id,{p:p,t:total,ba:ha?bal[t.acc]:0,bb:hb?bal[t.to]:0});
    if(t.debt&&t.dr==='pay'){paid[t.debt]=r2((paid[t.debt]||0)+num(t.amt));(pays[t.debt]=pays[t.debt]||[]).push(t)}
    var dd=(t.dt||'').slice(0,10),fee=num(t.fee);
    if(dd.slice(0,7)===mon){st.mFee+=fee;if(!t.debt){if(t.type==='in')st.mIn+=num(t.amt);if(t.type==='out'){st.mOut+=num(t.amt);var c=t.cat||'Others';st.cats[c]=(st.cats[c]||0)+num(t.amt)}}}
    if(dd===today&&!t.debt){if(t.type==='in')st.dIn+=num(t.amt);if(t.type==='out')st.dOut+=num(t.amt)+fee}
  });
  var owe=0,rec=0,dm=new Map(),mo=0,monN=0,dueNow=0,dueN=0,overN=0;
  live(S.debts).forEach(function(d){
    var tot=debtTotal(d),ps=pays[d.id]||[],pd=paid[d.id]||0,left=r2(Math.max(0,tot-pd)),freq=d.freq||'once';
    var x={d:d,total:tot,paid:pd,left:left,n:ps.length,per:null,next:d.due||'9999',st:'',sc:'',pp:{}};
    ps.forEach(function(t){x.pp[(t.dt||'').slice(0,10)]=1});
    x.paidIn=function(p){var s=0;ps.forEach(function(t){var k=(t.dt||'').slice(0,10);if(k>=p.s&&k<=p.e)s+=num(t.amt)});return r2(s)};
    if(left>0&&isSched(d)){
      var p=period(freq,d.due,tdy);
      if(p){var pp=x.paidIn(p),want=r2(Math.min(left,planAmt(d,p))),rem=r2(Math.max(0,want-pp));p.paid=pp;p.want=want;p.rem=rem;x.per=p;
        if(want<=0||rem<=0){var np=nextDue(d,p);x.next=np?np.due:'9999';
          x.st=(want<=0?'No payment this period':'Paid this period')+(np?' · Next '+fdate(np.due)+' '+money(Math.min(left,planAmt(d,np))):'');x.sc=want<=0?'':'pos'}
        else if(today>p.due){x.next=p.due;x.st='Overdue since '+fdate(p.due)+' · '+money(rem);x.sc='neg'}
        else{x.next=p.due;x.st='Due '+fdate(p.due)+' · '+money(rem);x.sc=''}
        if(d.kind==='owe'){
          /* dues this calendar month: sum of planned amounts of periods whose due date is in this month */
          var q=period(freq,d.due,new Date(tdy.getFullYear(),tdy.getMonth(),1)),mw=0,mp=0,g=0;
          while(q&&q.s<=mon+'-31'&&g<10){if(q.due.slice(0,7)===mon){var w=Math.min(left,planAmt(d,q));mw+=w;mp+=Math.min(w,x.paidIn(q))}q=nextPeriod(freq,d.due,q);g++}
          if(freq==='yearly'||freq==='quarterly'){if(p.due.slice(0,7)===mon){mw=want;mp=Math.min(want,pp)}else{mw=0;mp=0}}
          if(mw>0){mo+=mw;monN++}
          if(rem>0){dueNow+=rem;dueN++;if(today>p.due)overN++}}}
    }else if(left>0&&d.due){x.st=(today>d.due?'Overdue since ':'Due ')+fdate(d.due);x.sc=today>d.due?'neg':''}
    else if(left<=0){x.st='Fully paid';x.sc='pos'}
    dm.set(d.id,x);if(d.kind==='owe')owe+=left;else rec+=left;
  });
  var sav=0;accs.forEach(function(a){if(a.sav)sav+=bal[a.id]});
  C={bal:bal,total:total,run:run,list:list,owe:r2(owe),rec:r2(rec),sav:r2(sav),dm:dm,st:st,mon:r2(mo),monN:monN,dueNow:r2(dueNow),dueN:dueN,overN:overN};
}

/* ---------- ui helpers ---------- */
var tT;
function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){e.classList.remove('on')},2200)}
var dlg=$('#dlg'),dlgIn=$('#dlgIn');
function openSheet(h){var bx=document.createElement('div');bx.innerHTML=h;dlgIn.innerHTML='';dlgIn.appendChild(bx);dlgIn.scrollTop=0;if(!dlg.open){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')}return bx}
function closeSheet(){if(dlg.close)dlg.close();else dlg.removeAttribute('open')}
dlg.addEventListener('click',function(e){if(e.target===dlg||e.target.closest('[data-close]'))closeSheet()});
function head(t){return '<div class="shd"><h2>'+t+'</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>'}
function accName(id){var a=byId(S.accounts,id);return a?a.name:'(deleted)'}
function accChips(list,sel,showBal){return list.map(function(a){return '<button type="button" class="chip'+(a.id===sel?' on':'')+'" data-id="'+a.id+'">'+esc(a.name)+(showBal?' <small>'+money(C.bal[a.id]||0)+'</small>':'')+'</button>'}).join('')}
function topCats(type){var f={};live(S.tx).forEach(function(t){if(t.type===type&&t.cat&&!t.debt)f[t.cat]=(f[t.cat]||0)+1});var a=Object.keys(f).sort(function(x,y){return f[y]-f[x]});(DEFCAT[type]||[]).forEach(function(c){if(a.indexOf(c)<0)a.push(c)});return a.slice(0,10)}
function allCats(){var s={};live(S.tx).forEach(function(t){if(t.cat)s[t.cat]=1});['out','in','xfer'].forEach(function(k){DEFCAT[k].forEach(function(c){s[c]=1})});return Object.keys(s)}
function memoList(){return Object.keys(S.memo).map(function(k){return S.memo[k]}).filter(function(m){return m&&!m.del}).sort(function(a,b){return b.u-a.u})}
function seg(el,v){$$('button',el).forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
function activeAccs(keep){return live(S.accounts).filter(function(a){return !a.hide||(keep&&keep.indexOf(a.id)>=0)})}
function defAcc(accs){var la=S.local.lastAcc;return (la&&accs.some(function(a){return a.id===la}))?la:(accs[0]?accs[0].id:'')}

/* ---------- fee picker (shared) ---------- */
function feeState(accId,fee,name){var a=byId(S.accounts,accId),fs=(a&&a.fees)||[];fee=num(fee);if(!fee)return{mode:'none',name:'',amt:0};for(var i=0;i<fs.length;i++)if(fs[i].name===name&&num(fs[i].amt)===fee)return{mode:i,name:name,amt:fee};return{mode:'custom',name:name||'',amt:fee}}
function feeHTML(){return '<label class="f lbl">Fee / Charge</label><div class="chips" id="fFee"></div><div id="wCus" hidden><div class="row2"><input id="fFeeName" placeholder="Fee name (e.g. InstaPay)"><input id="fFeeAmt" inputmode="decimal" placeholder="0.00"></div><label class="ck"><input type="checkbox" id="fRem" checked> Remember this fee for this account</label></div>'}
function paintFee(accId,fs){var a=byId(S.accounts,accId),fees=(a&&a.fees)||[];
  $('#fFee').innerHTML='<button type="button" class="chip'+(fs.mode==='none'?' on':'')+'" data-m="none">No fee</button>'+fees.map(function(f,i){return '<button type="button" class="chip'+(fs.mode===i?' on':'')+'" data-m="'+i+'">'+esc(f.name)+' <small>'+money(f.amt)+'</small></button>'}).join('')+'<button type="button" class="chip'+(fs.mode==='custom'?' on':'')+'" data-m="custom">+ Other fee</button>';
  $('#wCus').hidden=fs.mode!=='custom'}
function bindFee(getAcc,fs,onch){
  $('#fFee').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;var m=b.dataset.m;fs.mode=(m==='none'||m==='custom')?m:+m;paintFee(getAcc(),fs);if(m==='custom'){$('#fFeeName').value=fs.name||'';$('#fFeeAmt').value=fs.amt||'';$('#fFeeName').focus()}onch()});
  $('#fFeeAmt').addEventListener('input',onch);
}
function readFee(accId,fs){var a=byId(S.accounts,accId),fees=(a&&a.fees)||[];
  if(fs.mode==='none')return{amt:0,name:''};
  if(fs.mode==='custom')return{amt:num($('#fFeeAmt').value),name:$('#fFeeName').value.trim()||'Fee',custom:true,rem:$('#fRem').checked};
  var f=fees[fs.mode];return f?{amt:num(f.amt),name:f.name}:{amt:0,name:''}}
function rememberFee(accId,fee){if(!fee.custom||!fee.rem||!fee.amt)return;var a=byId(S.accounts,accId);if(!a)return;a.fees=a.fees||[];var ex=null;a.fees.forEach(function(f){if(f.name.toLowerCase()===fee.name.toLowerCase())ex=f});if(ex)ex.amt=fee.amt;else a.fees.push({name:fee.name,amt:fee.amt});a.u=now()}

/* ---------- transaction form ---------- */
function txForm(t){
  var ed=!!t,accs=activeAccs(t?[t.acc,t.to]:null);
  if(!accs.length){toast('Add an account first');return}
  var f=ed?{type:t.type,acc:t.acc,to:t.to||''}:{type:'out',acc:defAcc(accs),to:''};
  var fs=ed?feeState(t.acc,t.fee,t.feeName):{mode:'none',name:'',amt:0};
  var run=ed?C.run.get(t.id):null,q=ed?[]:memoList().slice(0,12);
  openSheet(head((ed?'Edit':'New')+' transaction')+
    (run?'<div class="ba"><div><div class="lbl">Balance before</div><b>'+money(run.p)+'</b></div><div style="text-align:right"><div class="lbl">Balance after</div><b>'+money(run.t)+'</b></div></div>':'')+
    (t&&t.debt?'<div class="hint" style="margin-bottom:10px">Linked to a debt/loan record.</div>':'')+
    '<div class="seg" id="fType"><button type="button" data-v="out">Expense</button><button type="button" data-v="in">Income</button><button type="button" data-v="xfer">Transfer</button></div>'+
    (q.length?'<label class="f lbl">Quick add (saved entries)</label><div class="chips scroll" id="fQuick">'+q.map(function(m){return '<button type="button" class="chip" data-k="'+esc(m.note.toLowerCase())+'">'+esc(m.note)+' <small>'+money(m.amt)+'</small></button>'}).join('')+'</div>':'')+
    '<input id="fAmt" class="amtin" inputmode="decimal" placeholder="0.00" value="'+(ed?num(t.amt):'')+'" autocomplete="off">'+
    '<label class="f lbl" id="lAcc">Account</label><div class="chips" id="fAcc"></div>'+
    '<div id="wTo"><label class="f lbl">To</label><div class="chips" id="fTo"></div></div>'+
    feeHTML()+
    '<label class="f lbl" for="fNote">Description</label><input id="fNote" list="dlNote" placeholder="e.g. Lunch, Grab, Salary" value="'+esc(ed?t.note:'')+'" autocomplete="off">'+
    '<label class="f lbl" for="fCat">Category</label><input id="fCat" list="dlCat" placeholder="Category" value="'+esc(ed?t.cat:'')+'" autocomplete="off"><div class="chips" id="fCats" style="margin-top:8px"></div>'+
    '<label class="f lbl" for="fDt">Date &amp; time</label><input id="fDt" type="datetime-local" value="'+(ed?t.dt:localISO())+'">'+
    '<div class="prev" id="fPrev"></div>'+
    '<button type="button" class="btn" id="fSave">Save</button>'+(ed?'<button type="button" class="btn dg" id="fDel">Delete</button>':'')+
    '<datalist id="dlNote">'+memoList().map(function(m){return '<option value="'+esc(m.note)+'">'}).join('')+'</datalist>'+
    '<datalist id="dlCat">'+allCats().map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist>');
  if(fs.mode==='custom'){$('#fFeeName').value=fs.name;$('#fFeeAmt').value=fs.amt}
  function paint(){
    seg($('#fType'),f.type);
    $('#lAcc').textContent=f.type==='xfer'?'From':f.type==='in'?'Received in':'Paid from';
    $('#fAcc').innerHTML=accChips(accs,f.acc,true);
    $('#wTo').hidden=f.type!=='xfer';
    if(f.type==='xfer')$('#fTo').innerHTML=accChips(accs.filter(function(a){return a.id!==f.acc}),f.to,true);
    paintFee(f.acc,fs);
    $('#fCats').innerHTML=topCats(f.type).map(function(c){return '<button type="button" class="chip'+(c===$('#fCat').value?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
    prev();
  }
  function prev(){
    var fee=readFee(f.acc,fs),d=delta({type:f.type,amt:$('#fAmt').value,fee:fee.amt}),o=ed?delta(t):{a:0,b:0};
    function base(id){var b=C.bal[id]||0;if(ed){if(t.acc===id)b=r2(b-o.a);if(t.type==='xfer'&&t.to===id)b=r2(b-o.b)}return b}
    var h='',ba=base(f.acc),na=r2(ba+d.a);
    h+='<div>'+esc(accName(f.acc))+': '+money(ba)+' → <b class="'+(na<ba?'neg':na>ba?'pos':'')+'">'+money(na)+'</b></div>';
    if(f.type==='xfer'&&f.to){var bb=base(f.to),nb=r2(bb+d.b);h+='<div>'+esc(accName(f.to))+': '+money(bb)+' → <b class="pos">'+money(nb)+'</b></div>'}
    if(fee.amt)h+='<div class="neg">Fee: '+money(fee.amt)+'</div>';
    if(na<0)h+='<div class="neg">Warning: balance will go negative.</div>';
    $('#fPrev').innerHTML=h;
  }
  function applyMemo(m,full){
    f.type=m.type||'out';if(m.acc&&accs.some(function(a){return a.id===m.acc}))f.acc=m.acc;
    f.to=(m.to&&accs.some(function(a){return a.id===m.to}))?m.to:'';
    if(full||!num($('#fAmt').value))$('#fAmt').value=num(m.amt)||'';
    if(full||!$('#fCat').value)$('#fCat').value=m.cat||'';
    $('#fNote').value=m.note;
    fs=feeState(f.acc,m.fee,m.feeName);if(fs.mode==='custom'){$('#fFeeName').value=fs.name;$('#fFeeAmt').value=fs.amt}
    paint();
  }
  $('#fType').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;f.type=b.dataset.v;if(f.to===f.acc)f.to='';paint()});
  $('#fAcc').addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;f.acc=b.dataset.id;if(f.to===f.acc)f.to='';if(typeof fs.mode==='number')fs.mode='none';paint()});
  $('#fTo').addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;f.to=b.dataset.id;paint()});
  $('#fCats').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;$('#fCat').value=b.dataset.c;paint()});
  var qk=$('#fQuick');if(qk)qk.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;var m=S.memo[b.dataset.k];if(m)applyMemo(m,true)});
  $('#fNote').addEventListener('change',function(){if(ed)return;var m=S.memo[this.value.trim().toLowerCase()];if(m&&!m.del)applyMemo(m,false)});
  $('#fAmt').addEventListener('input',prev);
  bindFee(function(){return f.acc},fs,prev);
  $('#fSave').addEventListener('click',function(){
    var amt=num($('#fAmt').value);if(amt<=0){toast('Enter an amount');$('#fAmt').focus();return}
    if(f.type==='xfer'&&(!f.to||f.to===f.acc)){toast('Choose the "To" account');return}
    var fee=readFee(f.acc,fs),note=$('#fNote').value.trim(),cat=$('#fCat').value.trim(),dt=$('#fDt').value||localISO();
    rememberFee(f.acc,fee);
    var o=t||{id:uid()},chg=!t||t.dt!==dt;
    o.type=f.type;o.amt=amt;o.acc=f.acc;o.to=f.type==='xfer'?f.to:'';o.fee=fee.amt;o.feeName=fee.amt?fee.name:'';o.note=note;o.cat=cat;o.dt=dt;o.u=now();
    if(chg)o.pos=dtPos(dt);if(!t)S.tx.push(o);
    if(note&&!o.debt)S.memo[note.toLowerCase()]={note:note,cat:cat,amt:amt,acc:o.acc,to:o.to,type:o.type,fee:o.fee,feeName:o.feeName,u:now()};
    S.local.lastAcc=f.acc;save();closeSheet();renderAll();toast(ed?'Updated':'Saved');
  });
  var del=$('#fDel');if(del)del.addEventListener('click',function(){if(!confirm('Delete this transaction? Balances will be recalculated.'))return;t.del=true;t.u=now();save();closeSheet();renderAll();toast('Deleted')});
  paint();
  if(!ed)setTimeout(function(){$('#fAmt').focus()},120);
}

/* ---------- payment plan: manual amount per month / period ---------- */
function planForm(d){
  if(!d.freq||d.freq==='once'){toast('Set a payment schedule first (e.g. Monthly)');debtForm(d);return}
  var x=C.dm.get(d.id),fr=d.freq,today=ymd(),work=Object.assign({},d.sched||{});
  var start=new Date(((d.dt&&d.due&&d.dt<d.due)?d.dt:(d.due||d.dt||today))+'T00:00');if(isNaN(start))start=new Date();
  var first=period(fr,d.due,start),cp=period(fr,d.due,new Date());
  /* show a few past periods (for reference) then the future */
  var p=first,rows=[],back=0;while(p.s<cp.s&&back<400){p=nextPeriod(fr,d.due,p);back++}
  p=first;var skip=Math.max(0,back-3);for(var i=0;i<skip;i++)p=nextPeriod(fr,d.due,p);
  var cnt=Math.max(12,(d.terms||0)-skip+1,back-skip+12);
  function build(n){rows=[];var q=p;for(var i=0;i<n;i++){rows.push(q);q=nextPeriod(fr,d.due,q)}}
  build(cnt);
  var unit={monthly:'month',yearly:'year',quarterly:'quarter',semi:'period',weekly:'week'}[fr];
  var bx=openSheet(head('Amount per '+unit+' · '+esc(d.name))+
    '<div class="ba"><div><div class="lbl">Remaining debt</div><b class="neg">'+money(x?x.left:debtTotal(d))+'</b></div><div style="text-align:right"><div class="lbl">Usual amount</div><b>'+(num(d.inst)?money(d.inst):'—')+'</b></div></div>'+
    '<div class="hint" style="margin:0 0 8px">Type the exact amount for each '+unit+'. Leave blank to use the usual amount. Type 0 if there is no payment that '+unit+'.</div>'+
    '<div class="row2" style="grid-template-columns:1fr auto;margin-top:0"><input id="plFill" inputmode="decimal" placeholder="Fill amount (e.g. 1000)"><button type="button" class="lnk" id="plFillB">Fill blanks</button></div>'+
    '<div id="plRows" style="margin-top:8px"></div>'+
    '<button type="button" class="lnk more" id="plMore">+ Show 12 more</button>'+
    '<div class="prev" id="plSum"></div>'+
    '<div class="btn2"><button type="button" class="btn gh" id="plClear">Clear all</button><button type="button" class="btn" id="plSave">Save</button></div>');
  function paintRows(){
    $('#plRows').innerHTML=rows.map(function(q){var has=Object.prototype.hasOwnProperty.call(work,q.s),pd=x?x.paidIn(q):0,past=q.e<today,isCur=q.s===cp.s;
      return '<div class="pl'+(past?' past':'')+(isCur?' cur':'')+'"><div class="pk"><b>'+esc(plabel(fr,q))+(isCur?' · now':'')+'</b><span>Due '+fdate(q.due)+(pd?' · paid '+money(pd):'')+'</span></div>'+
        '<input data-k="'+q.s+'" inputmode="decimal" placeholder="'+(num(d.inst)?nf.format(num(d.inst)):'0.00')+'" value="'+(has?num(work[q.s]):'')+'"></div>'}).join('');
    sum()}
  function sum(){var tot=0,fut=0,left=x?x.left:debtTotal(d);
    rows.forEach(function(q){var a=Object.prototype.hasOwnProperty.call(work,q.s)?num(work[q.s]):num(d.inst);if(q.e>=today){fut+=Math.max(0,a-(x?x.paidIn(q):0))}tot+=a});
    var diff=r2(left-fut);
    $('#plSum').innerHTML='<div>Planned (this '+unit+' onward): <b>'+money(fut)+'</b></div><div>Remaining debt: <b>'+money(left)+'</b></div>'+
      (Math.abs(diff)<0.01?'<div class="pos">Plan matches your remaining debt ✓</div>':diff>0?'<div class="neg">'+money(diff)+' not yet scheduled (show more '+unit+'s or adjust)</div>':'<div class="neg">Plan is '+money(-diff)+' more than the remaining debt</div>')}
  $('#plRows').addEventListener('input',function(e){var k=e.target.dataset.k;if(!k)return;if(e.target.value.trim()==='')delete work[k];else work[k]=num(e.target.value);sum()});
  $('#plFillB').addEventListener('click',function(){var v=$('#plFill').value.trim();if(v===''){toast('Type an amount first');return}var n=num(v);
    rows.forEach(function(q){if(q.e>=today&&!Object.prototype.hasOwnProperty.call(work,q.s))work[q.s]=n});paintRows()});
  $('#plMore').addEventListener('click',function(){build(rows.length+12);paintRows()});
  $('#plClear').addEventListener('click',function(){if(!confirm('Clear all manual amounts? The usual amount will be used.'))return;work={};paintRows()});
  $('#plSave').addEventListener('click',function(){d.sched=work;d.u=now();if(!num(d.inst)&&!hasPlan(d)){toast('Enter at least one amount');return}
    save();renderAll();debtView(d.id);toast('Payment plan saved')});
  paintRows();
}

  $('#budCard').innerHTML=h;var sb=$('#setBud');if(sb)sb.addEventListener('click',settingsForm);
  var accs=live(S.accounts);
  $('#accs').innerHTML=accs.filter(function(a){return !a.hide||a.id===accF}).map(function(a){var b=C.bal[a.id]||0;return '<div class="acc'+(a.id===accF?' on':'')+'" data-a="'+a.id+'" role="button" tabindex="0"><button type="button" class="ed" data-e="'+a.id+'" aria-label="Edit">⋯</button><div class="n">'+esc(a.name)+'</div><div class="ty">'+(TYPES[a.type]||'')+(a.sav?' · Savings':'')+'</div><div class="b '+(b<0?'neg':'')+'">'+money(b)+'</div></div>'}).join('');
  $('#histT').textContent=accF?'History · '+accName(accF):'History';
  renderList();
}
function renderList(){
  var q=$('#q').value.trim().toLowerCase(),all=C.list.slice().reverse();
  if(accF)all=all.filter(function(t){return t.acc===accF||t.to===accF});
  if(q)all=all.filter(function(t){return ((t.note||'')+' '+(t.cat||'')+' '+accName(t.acc)+' '+(t.to?accName(t.to):'')+' '+(t.feeName||'')).toLowerCase().indexOf(q)>=0});
  shown=all.slice(0,lim);$('#moreBtn').hidden=all.length<=lim;
  if(!shown.length){$('#list').innerHTML='<div class="empty">'+(q||accF?'No matching transactions.':'No transactions yet.<br>Tap + to add your first income or expense.')+'</div>';return}
  $('#list').innerHTML=shown.map(function(t){
    var r=C.run.get(t.id)||{},d=delta(t),amt,bal,amtH,sub=[];
    if(accF){var isTo=t.type==='xfer'&&t.to===accF&&t.acc!==accF;amt=isTo?d.b:d.a;bal=isTo?r.bb:r.ba;amtH='<span class="'+cls(amt)+'">'+sgn(amt)+'</span>'}
    else{bal=r.t;if(t.type==='xfer')amtH='<span>⇄ '+money(t.amt)+'</span>';else amtH='<span class="'+cls(d.a)+'">'+sgn(t.type==='in'?num(t.amt):-num(t.amt))+'</span>'}
    if(t.cat)sub.push(esc(t.cat));
    sub.push(t.type==='xfer'?esc(accName(t.acc))+' → '+esc(accName(t.to)):esc(accName(t.acc)));
    sub.push(esc(fdt(t.dt)));
    var title=t.note||t.cat||({in:'Income',out:'Expense',xfer:'Transfer'}[t.type]);
    return '<div class="tx" data-id="'+t.id+'"><span class="h" aria-label="Drag to reorder">⋮⋮</span><div class="m"><div class="t1">'+esc(title)+'</div><div class="t2">'+sub.join(' · ')+'</div></div><div class="r"><div class="amt">'+amtH+'</div>'+(num(t.fee)?'<div class="bal neg">fee −'+money(t.fee)+'</div>':'')+'<div class="bal">Bal '+money(bal)+'</div></div></div>'
  }).join('');
}
function renderDebt(){
  var net=r2(C.total+C.rec-C.owe),after=r2(C.total-C.owe);
  $('#tOwe').innerHTML='<span class="'+(C.owe?'neg':'')+'">'+money(C.owe)+'</span>';$('#tRec').innerHTML='<span class="'+(C.rec?'pos':'')+'">'+money(C.rec)+'</span>';
  $('#tMoney').textContent=money(C.total);$('#tAfter').innerHTML='<span class="'+(after<0?'neg':'')+'">'+money(after)+'</span>';
  $('#tNet').innerHTML='<span class="'+cls(net)+'">'+money(net)+'</span>';$('#tSav').textContent=money(C.sav);
  $('#tMon').textContent=money(C.mon);$('#tMonN').textContent=C.monN?C.monN+' loan'+(C.monN>1?'s':'')+' due this month':'No dues this month';
  $('#tDue').innerHTML='<span class="'+(C.dueNow?'neg':'')+'">'+money(C.dueNow)+'</span>';
  $('#tDueN').innerHTML=C.overN?'<span class="neg">'+C.overN+' overdue</span>':(C.dueN?C.dueN+' to pay':(C.monN?'<span class="pos">All paid ✓</span>':'—'));
  var all=Array.from(C.dm.values()),cs={};
  all.forEach(function(x){if(x.left>0||dFil!=='act'){var c=x.d.cat||'Others';cs[c]=(cs[c]||0)+(x.d.kind==='owe'?x.left:0)}});
  var ck=Object.keys(cs);if(dCat&&ck.indexOf(dCat)<0)dCat='';
  $('#dCat').hidden=ck.length<2;
  $('#dCat').innerHTML='<button type="button" class="chip'+(!dCat?' on':'')+'" data-c="">All</button>'+ck.sort(function(a,b){return cs[b]-cs[a]}).map(function(c){return '<button type="button" class="chip'+(c===dCat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+(cs[c]?' <small>'+money(cs[c])+'</small>':'')+'</button>'}).join('');
  var arr=all.filter(function(x){return (dFil==='all'||(dFil==='act'?x.left>0:x.left<=0))&&(!dCat||(x.d.cat||'Others')===dCat)});
  arr.sort(function(a,b){if(!!a.left!==!!b.left)return a.left?-1:1;return a.next<b.next?-1:a.next>b.next?1:(b.d.u-a.d.u)});
  $('#dList').innerHTML=arr.length?arr.map(function(x){var d=x.d,owe=d.kind==='owe',pct=x.total?Math.min(100,x.paid/x.total*100):0;
    return '<div class="card debt" data-d="'+d.id+'"><div class="top"><b>'+esc(d.name)+'</b><span class="mid '+(x.left?(owe?'neg':'pos'):'')+'">'+money(x.left)+'</span></div>'+
    '<div class="t2" style="margin-top:4px"><span class="tag '+(owe?'neg':'pos')+'">'+(owe?'I owe':'Owed to me')+'</span>'+(d.cat&&d.cat!==d.name?'<span class="tag">'+esc(d.cat)+'</span>':'')+'</div>'+
    '<div class="sched"><span>'+esc(freqText(d))+(d.terms?' · '+x.n+'/'+d.terms+' paid':'')+'</span>'+(x.per&&x.per.want>0?'<b class="num">'+money(x.per.want)+'</b>':'')+'</div>'+
    (x.st?'<div class="sched"><span class="'+x.sc+'">'+esc(x.st)+'</span></div>':'')+
    '<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="t2" style="margin-top:6px">Paid '+money(x.paid)+' of '+money(x.total)+'</div></div>'}).join(''):'<div class="empty">'+(dFil==='act'?'No active debts or loans. 🎉':'Nothing here.')+'<br>Tap "+ Add" to record SPayLater, Pag-IBIG, SSS loan, etc.</div>';
}

/* ---------- drag to reorder ---------- */
(function(){
  var list=$('#list'),sc=$('#p1'),st=null;
  list.addEventListener('pointerdown',function(e){
    var h=e.target.closest('.h');if(!h||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();
    var row=h.closest('.tx'),rows=$$('.tx',list),idx=rows.indexOf(row);
    st={h:h,row:row,rows:rows,idx:idx,ni:idx,geo:rows.map(function(r){return{top:r.offsetTop,h:r.offsetHeight}}),y0:e.clientY,s0:sc.scrollTop,py:e.clientY,id:e.pointerId};
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    row.classList.add('drag');rows.forEach(function(r){if(r!==row)r.classList.add('sh')});
    if(navigator.vibrate)navigator.vibrate(10);loop();
  });
  list.addEventListener('pointermove',function(e){if(!st||e.pointerId!==st.id)return;e.preventDefault();st.py=e.clientY;upd()});
  function end(){if(!st)return;cancelAnimationFrame(st.raf);var s=st;st=null;s.rows.forEach(function(r){r.style.transform='';r.classList.remove('sh','drag')});if(s.ni!==s.idx)reorder(s.idx,s.ni)}
  list.addEventListener('pointerup',end);list.addEventListener('pointercancel',end);list.addEventListener('lostpointercapture',end);
  function upd(){var dy=st.py-st.y0+(sc.scrollTop-st.s0),g=st.geo[st.idx],c=g.top+dy+g.h/2,ni=st.idx;
    st.row.style.transform='translateY('+dy+'px)';
    for(var i=0;i<st.rows.length;i++){if(i===st.idx)continue;var m=st.geo[i].top+st.geo[i].h/2,s=0;
      if(i<st.idx&&c<m){s=g.h;ni--}else if(i>st.idx&&c>m){s=-g.h;ni++}
      st.rows[i].style.transform=s?'translateY('+s+'px)':''}
    st.ni=ni}
  function loop(){if(!st)return;var r=sc.getBoundingClientRect(),z=70,v=0;
    if(st.py<r.top+z)v=-Math.ceil((r.top+z-st.py)/5);else if(st.py>r.bottom-z)v=Math.ceil((st.py-(r.bottom-z))/5);
    if(v){var b=sc.scrollTop;sc.scrollTop+=v;if(sc.scrollTop!==b)upd()}st.raf=requestAnimationFrame(loop)}
})();
function reorder(i,j,again){
  var a=shown.slice(),t=a.splice(i,1)[0];a.splice(j,0,t);
  var up=a[j-1],dn=a[j+1],p;
  if(up&&dn)p=(up.pos+dn.pos)/2;else if(up)p=up.pos-1000;else if(dn)p=dn.pos+1000;else return;
  if((up&&!(p<up.pos))||(dn&&!(p>dn.pos))){if(again)return;respace();return reorder(i,j,true)}
  t.pos=p;t.u=now();save();renderAll();toast('Moved · balances updated');
}
function respace(){var l=live(S.tx).sort(function(a,b){return a.pos-b.pos});for(var k=1;k<l.length;k++){if(l[k].pos<=l[k-1].pos+1){l[k].pos=l[k-1].pos+10;l[k].u=now()}}}
function sortByDate(){if(!confirm('Re-arrange all transactions by their date & time? (Manual drag order will be reset.)'))return;
  var l=live(S.tx).slice().sort(function(a,b){return a.dt<b.dt?-1:a.dt>b.dt?1:a.pos-b.pos}),last=-Infinity;
  l.forEach(function(t){var p=new Date(t.dt).getTime();if(!isFinite(p))p=t.pos;if(p<=last)p=last+1;if(p!==t.pos){t.pos=p;t.u=now()}last=p});save();renderAll();toast('Sorted by date')}

/* ---------- events ---------- */
var pager=$('#pager'),page=0;
function setPage(i){page=i;$$('.tab').forEach(function(t){t.classList.toggle('on',+t.dataset.p===i)})}
pager.addEventListener('scroll',function(){var i=Math.round(pager.scrollLeft/Math.max(1,pager.clientWidth));if(i!==page)setPage(i)},{passive:true});
$$('.tab').forEach(function(t){t.addEventListener('click',function(){var i=+t.dataset.p;pager.scrollTo({left:i*pager.clientWidth,behavior:'smooth'});setPage(i)})});
$('#fab').addEventListener('click',function(){if(page===1&&innerWidth<900)debtForm();else txForm()});
$('#setBtn').addEventListener('click',settingsForm);
$('#syncBtn').addEventListener('click',function(){sync(true)});
$('#addAcc').addEventListener('click',function(){accForm()});
$('#addDebt').addEventListener('click',function(){debtForm()});
$('#sortBtn').addEventListener('click',sortByDate);
$('#moreBtn').addEventListener('click',function(){lim+=60;renderList()});
var qT;$('#q').addEventListener('input',function(){clearTimeout(qT);qT=setTimeout(function(){lim=60;renderList()},150)});
$('#accs').addEventListener('click',function(e){var b=e.target.closest('[data-e]');if(b){accForm(byId(S.accounts,b.dataset.e));return}var a=e.target.closest('[data-a]');if(!a)return;accF=accF===a.dataset.a?'':a.dataset.a;lim=60;renderBudget()});
$('#list').addEventListener('click',function(e){if(e.target.closest('.h'))return;var r=e.target.closest('.tx');if(r)txForm(byId(S.tx,r.dataset.id))});
$('#dList').addEventListener('click',function(e){var c=e.target.closest('[data-d]');if(c)debtView(c.dataset.d)});
$('#dFil').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;dFil=b.dataset.v;seg($('#dFil'),dFil);renderDebt()});
$('#dCat').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;dCat=b.dataset.c;renderDebt()});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
window.addEventListener('storage',function(e){if(e.key===KEY){load();applyTheme();renderAll()}});

/* ---------- start ---------- */
load();applyTheme();renderAll();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
if(S.local.syncUrl)setTimeout(function(){sync(false)},600);
})();
</script>
